<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <script src="https://cdn.tailwindcss.com" ></script>
    
     <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>

</head>
<body class="bg-slate-100 text-slate-800 antialised min-h-screen flex flex-col">

<header class="bg-slate-900 text-white shadow">
    <div class="max-w-5xl mx-auto px-4 py-5 flex flex-col md:flex-row justify-between item-center gap-4">
        <div class="text-center md:text-left">
    <h1 class="text-center font-bold tracking-tight text-white">
        Information of School Event Al-abidin Billingual Boarding School
    </h1>
    <p class="text-xs text-slate-400 mt-0.5">
      Show yout talent!!
    </p>
    </div>
    <nav class="flex gap-6 text-sm font-medium text-slate-300">
        <a href="#" class="hover:text-white transition-colors">Home</a>
        <a href="#" class="hover:text-white transition-colors">About</a>
    <a href="#" class="hover:text-white transition-colors">Guide</a>
    <a href="#" class="text-blue-400 font-semibold border-b-2 border-blue-400 pb-0.5">Register</a>
    
    </nav>
    </div>
</header>
<main class="flex-grow max-w-3xl mx-auto px-4 py-10 w-full">
    <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6 sm:p-8">
        <div class="border-b border-slate-100 pb-6 mb-6">
            <h2 class="text2xl font-bold text-slate-900">
                Regristation Form</h2>
                <p class="text-slate-600 text-sm mt-1">
Please fill in your information
                </p>
            
        </div>
        <form action="#" method="POST" class="space-y-5">

            <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                <div>
                    <label for="name" class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-2">
                            Enter your full name.. <span class="text-red-500">*</span>
                        </label>
                        <input type="text" id="name" name="name" required placeholder="Masukkan nama lengkap" 
                            class="w-full px-3.5 py-2.5 rounded-lg border border-slate-300 text-sm text-slate-900 placeholder:text-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-600 focus:border-transparent transition">
                    </div>
                </div>
            </div>
        </form>
    </div>
</main>

    

</html>
